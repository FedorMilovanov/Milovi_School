name: Temporary Playwright lock generator

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_generate-playwright-lock.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Generate and verify exact manifests
        run: |
          npm install --package-lock-only --save-dev --save-exact playwright@1.60.0
          node -e "const p=require('./package.json'); if(p.devDependencies.playwright!=='1.60.0') process.exit(1)"
          npm ci --ignore-scripts
          node -e "require('playwright'); console.log('Playwright module resolves from lockfile')"
      - name: Commit manifests to PR branch
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Generated manifests already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'test(browser): pin Playwright for consent contracts'
          git push origin HEAD:${{ github.head_ref }}

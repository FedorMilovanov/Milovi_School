name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install generated-site audit dependencies
        run: python3 -m pip install --user pillow beautifulsoup4

      - name: Validate analytics-disabled build
        run: npm run validate
        env:
          PUBLIC_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate configured verification and consent build
        run: |
          rm -rf dist
          npm run build
          npm run audit:site
          npm run audit:privacy
        env:
          PUBLIC_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ci-google-token
          PUBLIC_YANDEX_SITE_VERIFICATION: ci-yandex-token
          PUBLIC_BING_SITE_VERIFICATION: ci-bing-token
          PUBLIC_GA_ID: G-CONSENTTEST
          PUBLIC_YANDEX_METRIKA_ID: '12345678'

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install generated-site audit dependencies
        run: python3 -m pip install --user pillow beautifulsoup4

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Audit content
        run: npm run audit:content

      - name: Audit dependencies at high severity
        run: npm run audit:security

      - name: Build analytics-disabled candidate
        run: npm run build
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}

      - name: Audit analytics-disabled raw build
        run: npm run audit:build

      - name: Audit analytics-disabled generated site
        run: npm run audit:site

      - name: Verify analytics-disabled trust contract
        run: npm run audit:privacy
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}

      - name: Build configured verification and consent candidate
        run: |
          rm -rf dist
          npm run build
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ci-google-token
          PUBLIC_YANDEX_SITE_VERIFICATION: ci-yandex-token
          PUBLIC_BING_SITE_VERIFICATION: ci-bing-token
          PUBLIC_GA_ID: G-CONSENTTEST
          PUBLIC_YANDEX_METRIKA_ID: '12345678'

      - name: Audit configured raw build
        run: npm run audit:build

      - name: Audit configured generated site
        run: npm run audit:site

      - name: Verify configured ownership and consent contract
        run: npm run audit:privacy
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ci-google-token
          PUBLIC_YANDEX_SITE_VERIFICATION: ci-yandex-token
          PUBLIC_BING_SITE_VERIFICATION: ci-bing-token
          PUBLIC_GA_ID: G-CONSENTTEST
          PUBLIC_YANDEX_METRIKA_ID: '12345678'

  canon-closeout:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/le-canon-sucre-implementation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Canon branch with write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies from current lock
        run: npm ci

      - name: Install generated-site audit dependencies
        run: python3 -m pip install --user pillow beautifulsoup4

      - name: Normalize exhibition CSS and remove duplicated gateway layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/styles/canon.css')
          text = path.read_text('utf-8')
          gateway_marker = '/* -------------------------------- Gateway -------------------------------- */'
          page_marker = '/* ------------------------------- Canon page ------------------------------- */'
          if gateway_marker not in text or page_marker not in text:
              raise SystemExit('Expected Canon gateway/page markers not found')

          prefix = text.split(gateway_marker, 1)[0].rstrip()
          page = page_marker + text.split(page_marker, 1)[1]
          text = prefix + '\n\n' + page.lstrip()

          if '.canon-work {\n  grid-column: span 4;' not in text:
              raise SystemExit('Expected legacy desktop work-grid rule not found')
          text = text.replace(
              '.canon-work {\n  grid-column: span 4;',
              '.canon-work {\n  grid-column: var(--canon-grid-start, auto) / span var(--canon-grid-span, 4);\n  grid-row: var(--canon-grid-row, auto);',
              1,
          )
          text = text.replace('\n.canon-work-anchor { grid-column: span 8; }\n', '\n', 1)
          text = text.replace('.canon-work { grid-column: span 6; }', '.canon-work { grid-column: span 6; grid-row: auto; }')
          text = text.replace('.canon-work-anchor { grid-column: span 12; }', '.canon-work-anchor { grid-column: span 12; grid-row: auto; }')
          text = text.replace('.canon-work { grid-column: span 12; }', '.canon-work { grid-column: span 12; grid-row: auto; }')

          # Remove gateway-only responsive rules left below the page marker.
          text = re.sub(r'(?ms)^\s*\.canon-gateway::before\s*\{.*?^\s*\}\n?', '', text)
          text = re.sub(r'(?m)^\s*\.canon-gateway[^\n{]*\{[^{}]*\}\n?', '', text)
          text = re.sub(r'(?m)^\s*\.canon-eyebrow[^\n{]*\{[^{}]*\}\n?', '', text)
          text = re.sub(r'(?m)^\s*\.canon-frame[^\n{]*\{[^{}]*\}\n?', '', text)
          text = text.replace('  .canon-gateway-media,\n  .canon-work-media', '  .canon-work-media')
          text = text.replace('  .canon-gateway,\n  .canon-gateway *,\n  .canon-work,', '  .canon-work,')
          text = text.replace('  .canon-gateway-media,\n  .canon-work-media,\n  .canon-work-image', '  .canon-work-media,\n  .canon-work-image')
          text = text.replace('  .canon-gateway-light,\n  .canon-work-sheen', '  .canon-work-sheen')

          for forbidden in ('.canon-gateway', '.canon-eyebrow', '.canon-frame', '.canon-object', 'inset-left:', 'inset-bottom:'):
              if forbidden in text:
                  raise SystemExit(f'Obsolete page-CSS token remained after cleanup: {forbidden}')
          for required in (
              'grid-column: var(--canon-grid-start, auto) / span var(--canon-grid-span, 4);',
              'grid-row: var(--canon-grid-row, auto);',
          ):
              if required not in text:
                  raise SystemExit(f'Required data-driven grid contract missing: {required}')

          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Refresh vulnerable transitive dependency lock
        run: npm audit fix --package-lock-only

      - name: Verify refreshed lock installs cleanly
        run: npm ci

      - name: Enforce high-severity dependency gate
        run: npm run audit:security

      - name: Type-check normalized tree
        run: npm run check

      - name: Lint normalized tree
        run: npm run lint

      - name: Build normalized candidate
        run: npm run build
        env:
          PUBLIC_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Diagnose homepage HTML audit candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          path = Path('dist/index.html')
          soup = BeautifulSoup(path.read_text('utf-8', errors='replace'), 'html.parser')
          print('--- French Pastry Archive DOM contexts ---')
          for node in soup.find_all(string=lambda value: value and 'French Pastry Archive' in value):
              parent = node.parent
              print(str(parent)[:1200])
          print('--- Buttons without obvious accessible name ---')
          for button in soup.find_all('button'):
              visible = button.get_text(' ', strip=True)
              labelled = button.get('aria-label') or button.get('title') or visible
              if not labelled:
                  print(str(button)[:1600])
          PY

      - name: Audit normalized generated site
        run: npm run audit:site

      - name: Restore permanent CI workflow and verify change scope
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          # audit:site intentionally refreshes this tracked generated report.
          # It is evidence from the run, not a closeout deliverable, so restore it
          # before enforcing the strict three-file mutation boundary.
          git restore --source=HEAD --worktree -- audit/site-audit-report.md
          allowed='^( M|M |A |D ) (package-lock\.json|src/styles/canon\.css|\.github/workflows/ci\.yml)$'
          unexpected="$(git status --porcelain | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected closeout changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified closeout and push branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/styles/canon.css .github/workflows/ci.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Closeout produced no verified changes"
            exit 1
          fi
          git commit -m "close Canon dependency and CSS quality gates"
          git push origin HEAD:agent/le-canon-sucre-implementation

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install generated-site audit dependencies
        run: python3 -m pip install --user pillow beautifulsoup4

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Audit content
        run: npm run audit:content

      - name: Audit dependencies at high severity
        run: npm run audit:security

      - name: Build analytics-disabled candidate
        run: npm run build
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}

      - name: Audit analytics-disabled raw build
        run: npm run audit:build

      - name: Audit analytics-disabled generated site
        run: npm run audit:site

      - name: Verify analytics-disabled trust contract
        run: npm run audit:privacy
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}

      - name: Build configured verification and consent candidate
        run: |
          rm -rf dist
          npm run build
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ci-google-token
          PUBLIC_YANDEX_SITE_VERIFICATION: ci-yandex-token
          PUBLIC_BING_SITE_VERIFICATION: ci-bing-token
          PUBLIC_GA_ID: G-CONSENTTEST
          PUBLIC_YANDEX_METRIKA_ID: '12345678'

      - name: Audit configured raw build
        run: npm run audit:build

      - name: Audit configured generated site
        run: npm run audit:site

      - name: Verify configured ownership and consent contract
        run: npm run audit:privacy
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ci-google-token
          PUBLIC_YANDEX_SITE_VERIFICATION: ci-yandex-token
          PUBLIC_BING_SITE_VERIFICATION: ci-bing-token
          PUBLIC_GA_ID: G-CONSENTTEST
          PUBLIC_YANDEX_METRIKA_ID: '12345678'

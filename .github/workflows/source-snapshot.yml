name: Source snapshot

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pack editorial source
        run: |
          tar -czf source-snapshot.tar.gz src/data scripts package.json package-lock.json astro.config.mjs

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish snapshot status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          [ "$JOB_STATUS" = "success" ] || state=failure
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"target_url\":\"$RUN_URL\",\"description\":\"Editorial source snapshot\",\"context\":\"source/snapshot\"}"

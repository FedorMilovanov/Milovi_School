name: Canon gateway visual acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/canon-gateway-hero/**'
      - 'public/images/canon-sucre/canon-gateway-hero.webp'
      - 'src/components/CanonGateway.tsx'
      - 'src/styles/canon-gateway.css'
      - 'scripts/materialize_canon_gateway_asset.mjs'
      - 'scripts/audit_canon_gateway_asset.py'
      - 'scripts/audit_canon_gateway_browser.mjs'
      - '.github/workflows/canon-gateway-visual.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: canon-gateway-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-head-browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          python3 -m pip install --user pillow beautifulsoup4
          npx playwright install --with-deps chromium

      - name: Verify exact owner-selected derivative
        run: |
          npm run materialize:canon-gateway
          npm run audit:canon-gateway

      - name: Build exact-head candidate
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}
          PUBLIC_GA_ID: G-CANONVISUAL
          PUBLIC_YANDEX_METRIKA_ID: '12345678'
        run: npm run build

      - name: Serve exact-head candidate
        shell: bash
        run: |
          python3 -m http.server 4174 --directory dist >/tmp/canon-gateway-server.log 2>&1 &
          echo $! >/tmp/canon-gateway-server.pid
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4174/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/canon-gateway-server.log
          exit 1

      - name: Capture desktop and mobile gateway screenshots
        env:
          BASE_URL: http://127.0.0.1:4174
        run: node scripts/audit_canon_gateway_browser.mjs

      - name: Upload exact-head screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canon-gateway-screenshots-${{ env.SOURCE_SHA }}
          path: |
            /tmp/canon-gateway-desktop.jpg
            /tmp/canon-gateway-mobile.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Stop exact-head candidate
        if: always()
        run: kill "$(cat /tmp/canon-gateway-server.pid)" 2>/dev/null || true

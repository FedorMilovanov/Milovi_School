name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build exact source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Astro project
        run: npm run check

      - name: Lint source
        run: npm run lint

      - name: Audit article content
        run: npm run audit:content

      - name: Security audit at high severity
        run: npm run audit:security

      - name: Build immutable site candidate
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_RELEASE_SHA: ${{ github.sha }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_YANDEX_SITE_VERIFICATION: ${{ vars.PUBLIC_YANDEX_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}

      - name: Audit unmodified raw build
        run: npm run audit:build

      - name: Install generated-site audit dependencies
        run: python3 -m pip install --user pillow beautifulsoup4

      - name: Audit generated site
        run: npm run audit:site

      - name: Verify privacy, ownership and release contracts
        run: npm run audit:privacy
        env:
          PUBLIC_RELEASE_SHA: ${{ github.sha }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_YANDEX_SITE_VERIFICATION: ${{ vars.PUBLIC_YANDEX_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}

      - name: Upload exact Pages candidate
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    name: Deploy exact candidate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  live-proof:
    name: Prove live domain serves this commit
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.sha }}
      LIVE_BASE: https://french.milovicake.ru
    steps:
      - name: Wait for CDN and verify immutable release witness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --connect-timeout 10 --max-time 20 "$LIVE_BASE/release.json?attempt=$attempt" || true)"
            if BODY="$body" python3 -c 'import json,os,sys; p=json.loads(os.environ["BODY"]); sys.exit(0 if p.get("repository")=="FedorMilovanov/Milovi_School" and p.get("sha")==os.environ["EXPECTED_SHA"] else 1)' 2>/dev/null; then
              echo "Live release witness matches $EXPECTED_SHA"
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Live release witness did not reach $EXPECTED_SHA" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Smoke policy and error surfaces
        run: |
          set -euo pipefail
          for path in / /privacy/ /editorial-policy/ /sources/ /corrections/; do
            curl -fsS --connect-timeout 10 --max-time 20 "$LIVE_BASE$path" >/dev/null
          done
          status="$(curl -sS -o /tmp/not-found.html -w '%{http_code}' "$LIVE_BASE/__release-proof-missing-page__")"
          test "$status" = "404"
          grep -qi 'noindex, follow' /tmp/not-found.html

name: One-shot privacy contract diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-privacy-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'feat/trust-consent-release-marathon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/trust-consent-release-marathon
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Build configured candidate and capture contract
        run: |
          npm ci
          PUBLIC_RELEASE_SHA=privacy-diagnostic \
          PUBLIC_GOOGLE_SITE_VERIFICATION=ci-google-token \
          PUBLIC_YANDEX_SITE_VERIFICATION=ci-yandex-token \
          PUBLIC_BING_SITE_VERIFICATION=ci-bing-token \
          PUBLIC_GA_ID=G-CONSENTTEST \
          PUBLIC_YANDEX_METRIKA_ID=12345678 \
          npm run build
          set +e
          PUBLIC_RELEASE_SHA=privacy-diagnostic \
          PUBLIC_GOOGLE_SITE_VERIFICATION=ci-google-token \
          PUBLIC_YANDEX_SITE_VERIFICATION=ci-yandex-token \
          PUBLIC_BING_SITE_VERIFICATION=ci-bing-token \
          PUBLIC_GA_ID=G-CONSENTTEST \
          PUBLIC_YANDEX_METRIKA_ID=12345678 \
          npm run audit:privacy > PRIVACY_CONTRACT_DIAGNOSTIC.txt 2>&1
          code=$?
          set -e
          printf '\nexit_code=%s\n' "$code" >> PRIVACY_CONTRACT_DIAGNOSTIC.txt
          cat PRIVACY_CONTRACT_DIAGNOSTIC.txt

      - name: Commit diagnostic and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-privacy-diagnostic.yml
          git add PRIVACY_CONTRACT_DIAGNOSTIC.txt
          git commit -m "chore(trust): preserve configured privacy diagnostic"
          git push origin HEAD:feat/trust-consent-release-marathon

name: Temporary consent state artifact

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_diagnose-consent-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      PUBLIC_GA_ID: G-DIAGNOSTIC
      PUBLIC_YANDEX_METRIKA_ID: '12345678'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Build and capture
        run: |
          npm ci --silent
          npx playwright install --with-deps chromium >/dev/null
          npm run build >/dev/null
          nohup python3 -m http.server 4174 --directory dist >/tmp/consent-artifact-server.log 2>&1 &
          echo $! >/tmp/consent-artifact-server.pid
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          node <<'JS'
          const fs = require('fs')
          const { chromium } = require('playwright')
          const output = { phase: 'start', requests: [], errors: [] }
          const flush = () => fs.writeFileSync('consent-diagnostic.json', JSON.stringify(output, null, 2))
          process.on('uncaughtException', error => { output.errors.push(`uncaughtException: ${error.stack || error}`); flush(); process.exit(0) })
          process.on('unhandledRejection', error => { output.errors.push(`unhandledRejection: ${error && error.stack || error}`); flush(); process.exit(0) })
          flush()
          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const context = await browser.newContext({ serviceWorkers: 'block' })
            const page = await context.newPage()
            page.on('request', request => {
              try {
                const url = request.url()
                if (/googletagmanager\.com|google-analytics\.com|mc\.yandex\.ru|metrika\.yandex/i.test(url)) {
                  output.requests.push(url)
                  flush()
                }
              } catch (error) {
                output.errors.push(`request-listener: ${error && error.stack || error}`)
                flush()
              }
            })
            output.phase = 'before-navigation'
            flush()
            await page.goto('http://127.0.0.1:4174/?artifact=4', { waitUntil: 'domcontentloaded' })
            output.phase = 'after-navigation'
            output.immediately = await page.evaluate(() => ({
              href: location.href,
              stored: localStorage.getItem('milovi_school_analytics_consent_v1'),
              apiChoice: window.MiloviSchoolConsent?.getChoice?.() ?? null,
              config: window.__MILOVI_SCHOOL_ANALYTICS__ ?? null,
              scripts: [...document.scripts].map(script => ({ src: script.src, prsGa: script.dataset.prsGa || null, prsYm: script.dataset.prsYm || null })),
              links: [...document.querySelectorAll('link[href]')].map(link => ({ rel: link.rel, href: link.href })).filter(item => /googletagmanager\.com|google-analytics\.com|mc\.yandex\.ru|metrika\.yandex/i.test(item.href)),
              panelCount: document.querySelectorAll('.prs-consent').length,
              panelVisible: Boolean(document.querySelector('.prs-consent') && !document.querySelector('.prs-consent').hidden),
              dataLayer: Array.isArray(window.dataLayer) ? window.dataLayer : null,
            }))
            flush()
            await page.waitForTimeout(1000)
            output.phase = 'after-delay'
            output.afterDelay = await page.evaluate(() => ({
              stored: localStorage.getItem('milovi_school_analytics_consent_v1'),
              apiChoice: window.MiloviSchoolConsent?.getChoice?.() ?? null,
              scripts: [...document.scripts].map(script => ({ src: script.src, prsGa: script.dataset.prsGa || null, prsYm: script.dataset.prsYm || null })),
              panelCount: document.querySelectorAll('.prs-consent').length,
              panelVisible: Boolean(document.querySelector('.prs-consent') && !document.querySelector('.prs-consent').hidden),
              dataLayer: Array.isArray(window.dataLayer) ? window.dataLayer : null,
              resources: performance.getEntriesByType('resource').map(entry => entry.name).filter(name => /googletagmanager\.com|google-analytics\.com|mc\.yandex\.ru|metrika\.yandex/i.test(name)),
            }))
            flush()
            await browser.close()
          })().catch(error => {
            output.errors.push(`caught: ${error && error.stack || error}`)
            flush()
          })
          JS
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consent-diagnostic-${{ github.run_id }}
          path: |
            consent-diagnostic.json
            /tmp/consent-artifact-server.log
          if-no-files-found: warn
          retention-days: 1
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/consent-artifact-server.pid)" 2>/dev/null || true

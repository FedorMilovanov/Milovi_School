name: One-shot trust migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-trust-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feat/trust-consent-release-marathon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/trust-consent-release-marathon
          fetch-depth: 0

      - name: Apply deterministic migration
        run: |
          python3 scripts/apply_trust_migration.py
          python3 -m py_compile scripts/audit_site.py scripts/apply_trust_migration.py
          git diff --check

      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-trust-migration.yml
          git add -A
          git commit -m "fix(seo): teach generated-site audit canonical-free 404"
          git push origin HEAD:feat/trust-consent-release-marathon

name: Apply editorial completion

on:
  push:
    branches: [complete-all-article-expansions]
    paths:
      - '.editorial-payload/**'
      - '.github/workflows/apply-editorial-completion.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v6
        with:
          ref: complete-all-article-expansions

      - name: Restore editorial source
        run: |
          cat .editorial-payload/chunk-* > /tmp/editorial-completion.b64
          base64 --decode /tmp/editorial-completion.b64 > /tmp/editorial-completion.tar.xz
          echo "2cef64741ce3e1839b79508f3a3607aef9d59f98f0a63768171138380c334d4e  /tmp/editorial-completion.tar.xz" | sha256sum --check
          tar -xJf /tmp/editorial-completion.tar.xz -C .
          rm -rf .editorial-payload
          rm -f .github/workflows/apply-editorial-completion.yml
          rm -f .github/workflows/source-snapshot.yml

      - name: Validate complete editorial coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import collections
          import re

          article_ids = re.findall(r"\bid:\s*'([^']+)'", Path('src/data/articles.ts').read_text())
          expansion_ids = []
          expansion_texts = []
          for path in sorted(Path('src/data/articleExpansionParts').glob('part*.ts')):
              text = path.read_text()
              expansion_ids += re.findall(r"^\s*'([^']+)': `", text, re.M)
              expansion_texts += re.findall(r"^\s*'[^']+': `([\s\S]*?)`,?(?=\n\s*'|\n\}\))", text, re.M)

          counts = collections.Counter(expansion_ids)
          assert len(article_ids) == 155, len(article_ids)
          assert len(expansion_ids) == 155, len(expansion_ids)
          assert len(counts) == 155, len(counts)
          assert not [item for item, count in counts.items() if count != 1]
          assert not [item for item in article_ids if item not in counts]
          assert not [item for item in counts if item not in set(article_ids)]
          assert all('## Французские источники редакции' in text for text in expansion_texts)
          print('Validated 155/155 unique editorial expansions')
          PY

      - name: Commit completed editorial library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete editorial expansions for all 155 articles"
          git push origin HEAD:complete-all-article-expansions

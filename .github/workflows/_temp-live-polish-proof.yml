name: Temporary School deep-polish live proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-live-polish-proof.yml'

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_BASE: https://french.milovicake.ru
      EXPECTED_SHA: 584ccabf1d0bd2906936449879b1a5faf3d35d75
    steps:
      - name: Prove exact release witness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --connect-timeout 10 --max-time 20 "$LIVE_BASE/release.json?round2=$attempt" || true)"
            echo "attempt=$attempt body=$body"
            if BODY="$body" python3 -c 'import json,os,sys; p=json.loads(os.environ["BODY"]); sys.exit(0 if p.get("repository")=="FedorMilovanov/Milovi_School" and p.get("sha")==os.environ["EXPECTED_SHA"] else 1)' 2>/dev/null; then
              echo "Exact live release proven: $EXPECTED_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Live release witness did not reach $EXPECTED_SHA" >&2
          exit 1

      - name: Smoke live trust surfaces
        shell: bash
        run: |
          set -euo pipefail
          for path in / /privacy/ /editorial-policy/ /sources/ /corrections/ /materials/; do
            status="$(curl -sS -o /tmp/page.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "$LIVE_BASE$path?round2=${GITHUB_RUN_ID}")"
            echo "$path -> $status"
            test "$status" = "200"
          done

      - name: Prove live homepage SSR and trust contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 20 "$LIVE_BASE/?round2=${GITHUB_RUN_ID}" -o /tmp/home.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/home.html').read_text('utf-8', errors='replace')
          if len(re.findall(r'<footer\b', html, flags=re.I)) != 1:
              raise SystemExit('homepage does not expose exactly one footer')
          for href in ('/privacy/', '/editorial-policy/', '/sources/', '/corrections/'):
              if f'href="{href}"' not in html:
                  raise SystemExit(f'missing trust link: {href}')
          stats = re.findall(r'<span\b[^>]*data-stat-label=["\x27]([^"\x27]+)["\x27][^>]*data-stat-target=["\x27]?(\d+)', html, flags=re.I)
          if len(stats) != 4:
              raise SystemExit(f'expected four SSR statistics, found {len(stats)}')
          if any(int(value) <= 0 for _, value in stats):
              raise SystemExit(f'non-truthful SSR statistics: {stats}')
          if 'SearchAction' in html or 'search_term_string' in html:
              raise SystemExit('obsolete SearchAction returned to production')
          print(f'Homepage SSR/trust contract proven: {stats}')
          PY

      - name: Prove true 404 contract
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/not-found.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "$LIVE_BASE/__deep-polish-missing__?round2=${GITHUB_RUN_ID}")"
          echo "missing page -> $status"
          test "$status" = "404"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/not-found.html').read_text('utf-8', errors='replace')
          tags = re.findall(r'<meta\b[^>]*>', html, flags=re.I)
          valid = any(
              re.search(r'\bname=["\x27]robots["\x27]', tag, flags=re.I)
              and re.search(r'\bcontent=["\x27]noindex,\s*follow["\x27]', tag, flags=re.I)
              for tag in tags
          )
          if not valid:
              raise SystemExit('404 response lacks robots noindex, follow')
          if re.search(r'<link\b[^>]*rel=["\x27]canonical["\x27]', html, flags=re.I):
              raise SystemExit('404 response emits canonical')
          print('404 deep-polish contract proven')
          PY

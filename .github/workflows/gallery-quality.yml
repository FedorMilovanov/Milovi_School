name: Apply verified editorial hardening

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == '[internal] apply zero-defect editorial hardening'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Retrieve and verify signed editorial patch
        run: |
          set -euo pipefail
          git fetch origin agent/editorial-zero-defects
          while IFS= read -r path; do
            [[ "$path" == '.editorial-payload/READY' ]] && continue
            git show "origin/agent/editorial-zero-defects:$path"
          done < <(git ls-tree -r --name-only origin/agent/editorial-zero-defects .editorial-payload | sort) \
            | base64 --decode > /tmp/editorial.patch.xz
          echo 'c638595c175d13afbfcb742721743cecca3ad813f3c46ff5b3b71afe10e9a36c  /tmp/editorial.patch.xz' | sha256sum --check --strict
          xz --decompress --stdout /tmp/editorial.patch.xz > /tmp/editorial.patch

      - name: Apply clean source changes
        run: |
          set -euo pipefail
          git checkout 0d62fde9086a4b24a4b382e4f0f74067afc7494b -- .github/workflows/gallery-quality.yml
          patch --dry-run --batch --forward -p1 < /tmp/editorial.patch
          patch --batch --forward -p1 < /tmp/editorial.patch
          git config user.name 'Milovi Editorial Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete zero-defect editorial hardening'
          git push origin HEAD:main

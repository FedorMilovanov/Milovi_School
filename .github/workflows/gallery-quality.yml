name: Publish verified source branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-source:
    if: github.event.pull_request.head.ref == 'agent/editorial-zero-defects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact verified payload
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct previously verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .editorial-payload/chunk-* > /tmp/editorial.patch.b64
          base64 --decode /tmp/editorial.patch.b64 > /tmp/editorial.patch.xz
          echo 'c638595c175d13afbfcb742721743cecca3ad813f3c46ff5b3b71afe10e9a36c  /tmp/editorial.patch.xz' | sha256sum --check --strict
          xz --test /tmp/editorial.patch.xz
          xz --decompress --stdout /tmp/editorial.patch.xz > /tmp/editorial.patch
          git fetch origin main
          git worktree add --detach /tmp/final origin/main
          cd /tmp/final
          patch --dry-run --batch --forward -p1 < /tmp/editorial.patch
          patch --batch --forward -p1 < /tmp/editorial.patch
          git diff --check

      - name: Publish non-workflow source files
        working-directory: /tmp/final
        shell: bash
        run: |
          set -euo pipefail
          git switch -c agent/editorial-final
          git config user.name 'Milovi Editorial Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json scripts/audit_editorial_quality.py src/data
          git reset -- src/data/articleOverrides.ts
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source changes to publish' >&2; exit 1; }
          git commit -m 'Add verified editorial source corpus'
          git push origin HEAD:refs/heads/agent/editorial-final

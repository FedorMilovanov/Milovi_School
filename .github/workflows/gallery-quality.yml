name: Export editorial payload diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-payload:
    if: github.event.pull_request.head.ref == 'agent/editorial-zero-defects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact payload source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Export payload and diagnostics
        shell: bash
        run: |
          set -uo pipefail
          find .editorial-payload -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > /tmp/chunk-sizes.txt
          sha256sum .editorial-payload/chunk-* | sort > /tmp/chunk-sha256.txt
          cat .editorial-payload/chunk-* > /tmp/editorial.patch.b64
          base64 --decode /tmp/editorial.patch.b64 > /tmp/editorial.patch.xz
          {
            wc -c /tmp/editorial.patch.b64 /tmp/editorial.patch.xz
            sha256sum /tmp/editorial.patch.b64 /tmp/editorial.patch.xz
            xz --list --verbose /tmp/editorial.patch.xz
            xz --test --verbose /tmp/editorial.patch.xz
          } > /tmp/xz-diagnostics.txt 2>&1 || true
          xz --decompress --stdout /tmp/editorial.patch.xz > /tmp/editorial.partial.patch 2>/tmp/xz-decompress-error.txt || true
          wc -c /tmp/editorial.partial.patch >> /tmp/xz-diagnostics.txt

      - name: Upload payload diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: editorial-payload-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/editorial.patch.b64
            /tmp/editorial.patch.xz
            /tmp/editorial.partial.patch
            /tmp/chunk-sizes.txt
            /tmp/chunk-sha256.txt
            /tmp/xz-diagnostics.txt
            /tmp/xz-decompress-error.txt
          if-no-files-found: error
          retention-days: 2

name: Gallery interaction quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/pages/materials.astro'
      - 'src/styles/global.css'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'scripts/audit_gallery_*.sh'
      - 'scripts/audit_gallery_*.mjs'
      - 'scripts/audit_raw_build.mjs'
      - 'eslint.config.js'
      - '.github/workflows/gallery-quality.yml'
  push:
    branches: [main, fix/react-19-ssr-root-cause]
    paths:
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/pages/materials.astro'
      - 'src/styles/global.css'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'scripts/audit_gallery_*.sh'
      - 'scripts/audit_gallery_*.mjs'
      - 'scripts/audit_raw_build.mjs'
      - 'eslint.config.js'
      - '.github/workflows/gallery-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-suppression-repair:
    name: Apply one-time suppression repair
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/react-19-ssr-root-cause' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/react-19-ssr-root-cause
          fetch-depth: 0

      - name: Patch suppression state machine and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gallery = Path('src/components/gallery/GalleryApp.tsx')
          text = gallery.read_text('utf-8')
          anchor = """  useEffect(() => {
            if (canUsePreview) return
            suppressedCardRef.current = null
            closePreview(false)
          }, [canUsePreview, closePreview])

          """
          replacement = anchor + """  useEffect(() => {
            const releaseSuppressionOutsideCard = (event: PointerEvent) => {
              const suppressedIndex = suppressedCardRef.current
              if (suppressedIndex === null || event.pointerType !== 'mouse') return

              const target = event.target
              const card = target instanceof Element ? target.closest('[data-gallery-index]') : null
              const targetIndex = card instanceof HTMLElement ? Number(card.dataset.galleryIndex) : null

              if (targetIndex !== suppressedIndex) {
                suppressedCardRef.current = null
              }
            }

            document.addEventListener('pointermove', releaseSuppressionOutsideCard, { passive: true })
            return () => document.removeEventListener('pointermove', releaseSuppressionOutsideCard)
          }, [])

          """
          if 'releaseSuppressionOutsideCard' not in text:
              if anchor not in text:
                  raise SystemExit('Gallery effect insertion anchor not found')
              gallery.write_text(text.replace(anchor, replacement, 1), 'utf-8')

          contract = Path('scripts/audit_gallery_contract.sh')
          source = contract.read_text('utf-8')
          check = "check 'Suppression is released when the pointer leaves that card' contains 'suppressedCardRef.current === index.*suppressedCardRef.current = null' src/components/gallery/GalleryApp.tsx\n"
          added = check + "check 'Suppression is released after real pointer movement outside the card' contains 'releaseSuppressionOutsideCard' src/components/gallery/GalleryApp.tsx\n"
          if 'Suppression is released after real pointer movement outside the card' not in source:
              if check not in source:
                  raise SystemExit('Source contract insertion anchor not found')
              contract.write_text(source.replace(check, added, 1), 'utf-8')
          PY
          git show HEAD^:.github/workflows/gallery-quality.yml > .github/workflows/gallery-quality.yml
          rm -f .github/workflows/patch-gallery-suppression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release preview suppression after real pointer movement'
          git push origin HEAD:fix/react-19-ssr-root-cause

  local-contract-and-browser:
    name: Source, build and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate audit shell syntax
        run: |
          bash -n scripts/audit_gallery_contract.sh
          bash -n scripts/audit_gallery_live.sh

      - name: Run repository and gallery source contracts
        run: bash scripts/audit_gallery_contract.sh

      - name: Type-check Astro and React
        run: npm run check

      - name: Lint complete source tree
        run: npm run lint

      - name: Audit article content
        run: npm run audit:content

      - name: Audit dependency security
        run: npm run audit:security

      - name: Build unmodified production candidate
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_YANDEX_SITE_VERIFICATION: ${{ vars.PUBLIC_YANDEX_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}

      - name: Audit raw production output
        run: npm run audit:build

      - name: Run generated gallery HTML contract checks
        run: node scripts/audit_gallery_generated.mjs

      - name: Install generated-site audit dependencies
        run: python3 -m pip install --user pillow beautifulsoup4

      - name: Audit generated static site
        run: npm run audit:site

      - name: Audit privacy and release contracts
        run: npm run audit:privacy
        env:
          PUBLIC_RELEASE_SHA: ${{ env.SOURCE_SHA }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_YANDEX_SITE_VERIFICATION: ${{ vars.PUBLIC_YANDEX_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}

      - name: Install Chromium for interaction audit
        run: npx playwright install --with-deps chromium

      - name: Start immutable local preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/milovi-preview.log 2>&1 &
          echo $! > /tmp/milovi-preview.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:4321/materials/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/milovi-preview.log >&2
          exit 1

      - name: Click through gallery behavior checks
        run: node scripts/audit_gallery_preview.mjs
        env:
          BASE_URL: http://127.0.0.1:4321

      - name: Print preview server log
        if: always()
        run: cat /tmp/milovi-preview.log || true

      - name: Stop preview server
        if: always()
        run: |
          if [[ -f /tmp/milovi-preview.pid ]]; then
            kill "$(cat /tmp/milovi-preview.pid)" 2>/dev/null || true
          fi

  external-live-audit:
    name: Validate deployed main through external services
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: local-contract-and-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate deployed commit with external services
        run: bash scripts/audit_gallery_live.sh
        env:
          LIVE_BASE: https://french.milovicake.ru
          EXPECTED_SHA: ${{ github.sha }}

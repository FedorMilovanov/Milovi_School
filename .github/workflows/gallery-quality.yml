name: Diagnose editorial payload

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-payload:
    if: github.event.pull_request.head.ref == 'agent/editorial-zero-defects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact payload source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify payload structure and compression
        shell: bash
        run: |
          set -euo pipefail
          test -f .editorial-payload/READY
          find .editorial-payload -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          sha256sum .editorial-payload/chunk-* | sort > /tmp/chunk-sha256.txt
          cat .editorial-payload/chunk-* > /tmp/editorial.patch.b64
          printf 'base64-bytes: '
          wc -c < /tmp/editorial.patch.b64
          base64 --decode /tmp/editorial.patch.b64 > /tmp/editorial.patch.xz
          printf 'decoded-bytes: '
          wc -c < /tmp/editorial.patch.xz
          printf 'decoded-sha256: '
          sha256sum /tmp/editorial.patch.xz
          xz --test /tmp/editorial.patch.xz
          xz --decompress --stdout /tmp/editorial.patch.xz > /tmp/editorial.patch
          printf 'patch-bytes: '
          wc -c < /tmp/editorial.patch
          printf 'patch-files: '
          grep -c '^diff --git ' /tmp/editorial.patch
          sed -n '1,20p' /tmp/editorial.patch
          tail -20 /tmp/editorial.patch

      - name: Upload payload diagnostics
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: editorial-payload-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/editorial.patch.xz
            /tmp/editorial.patch
            /tmp/chunk-sha256.txt
          if-no-files-found: error
          retention-days: 2

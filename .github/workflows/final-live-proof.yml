name: Final live proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-live-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for and verify exact production release
        env:
          EXPECTED_SHA: c0cd25ac7977a70849fc4ccf1833745bbbf0e60f
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base='https://french.milovicake.ru'
          expected=os.environ['EXPECTED_SHA']
          last=''
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(base+'/release.json?proof='+str(time.time()), timeout=20) as r:
                      data=json.load(r)
                  last=str(data)
                  if data.get('repository') == 'FedorMilovanov/Milovi_School' and data.get('sha') == expected:
                      break
              except Exception as exc:
                  last=repr(exc)
              time.sleep(15)
          else:
              raise SystemExit(f'exact release not live: expected={expected}, last={last}')

          for route in ('/','/privacy/','/editorial-policy/','/sources/','/corrections/','/materials/'):
              with urllib.request.urlopen(base+route+'?proof='+str(time.time()), timeout=20) as r:
                  if r.status != 200:
                      raise SystemExit(f'{route}: HTTP {r.status}')

          missing='/__final-hygiene-proof-'+str(int(time.time()))
          try:
              urllib.request.urlopen(base+missing, timeout=20)
              raise SystemExit('unknown route unexpectedly returned success')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              html=exc.read().decode('utf-8',errors='replace')
              if 'noindex, follow' not in html or 'rel="canonical"' in html:
                  raise SystemExit('404 metadata contract failed')
          print(f'School production proof passed for {expected}')
          PY

name: Temporary network-source diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_diagnose-network-source.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      PUBLIC_GA_ID: G-DIAGNOSTIC
      PUBLIC_YANDEX_METRIKA_ID: '12345678'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Build and serve configured candidate
        run: |
          npm ci --silent
          npx playwright install --with-deps chromium >/dev/null
          npm run build >/dev/null
          nohup python3 -m http.server 4174 --directory dist >/tmp/network-source-server.log 2>&1 &
          echo $! >/tmp/network-source-server.pid
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:4174/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Source N1 — Google Tag Manager must stay silent
        run: node -e "const{chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true}),c=await b.newContext({serviceWorkers:'block'}),p=await c.newPage();let a=[];p.on('request',r=>/googletagmanager\.com/i.test(r.url())&&a.push(r.url()));await p.goto('http://127.0.0.1:4174/?n=gtm',{waitUntil:'domcontentloaded'});await p.waitForTimeout(700);console.log(a);if(a.length)throw Error(a.join('\\n'));await b.close()})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Source N2 — Google Analytics endpoint must stay silent
        run: node -e "const{chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true}),c=await b.newContext({serviceWorkers:'block'}),p=await c.newPage();let a=[];p.on('request',r=>/google-analytics\.com/i.test(r.url())&&a.push(r.url()));await p.goto('http://127.0.0.1:4174/?n=ga',{waitUntil:'domcontentloaded'});await p.waitForTimeout(700);console.log(a);if(a.length)throw Error(a.join('\\n'));await b.close()})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Source N3 — Yandex Metrika loader must stay silent
        run: node -e "const{chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true}),c=await b.newContext({serviceWorkers:'block'}),p=await c.newPage();let a=[];p.on('request',r=>/mc\.yandex\.ru/i.test(r.url())&&a.push(r.url()));await p.goto('http://127.0.0.1:4174/?n=ym',{waitUntil:'domcontentloaded'});await p.waitForTimeout(700);console.log(a);if(a.length)throw Error(a.join('\\n'));await b.close()})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Source N4 — alternate Yandex endpoints must stay silent
        run: node -e "const{chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true}),c=await b.newContext({serviceWorkers:'block'}),p=await c.newPage();let a=[];p.on('request',r=>/metrika\.yandex/i.test(r.url())&&a.push(r.url()));await p.goto('http://127.0.0.1:4174/?n=yandex',{waitUntil:'domcontentloaded'});await p.waitForTimeout(700);console.log(a);if(a.length)throw Error(a.join('\\n'));await b.close()})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Stop diagnostic server
        if: always()
        run: kill "$(cat /tmp/network-source-server.pid)" 2>/dev/null || true

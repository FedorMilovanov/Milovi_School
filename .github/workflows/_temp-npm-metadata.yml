name: One-shot npm metadata

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-npm-metadata.yml'

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'feat/trust-consent-release-marathon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/trust-consent-release-marathon
          fetch-depth: 0

      - name: Capture npm package metadata
        run: |
          {
            echo '## brace-expansion versions'
            npm view brace-expansion versions --json
            echo
            echo '## minimatch latest'
            npm view minimatch version dependencies --json
            echo
            echo '## minimatch 10.0.3'
            npm view minimatch@10.0.3 version dependencies --json
            echo
            echo '## minimatch 10.1.1'
            npm view minimatch@10.1.1 version dependencies --json
            echo
            echo '## eslint latest'
            npm view eslint version dependencies.minimatch --json
            echo
            echo '## jsx-a11y latest'
            npm view eslint-plugin-jsx-a11y version dependencies.minimatch --json
          } > NPM_METADATA.txt
          cat NPM_METADATA.txt

      - name: Commit metadata and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-npm-metadata.yml
          git add NPM_METADATA.txt
          git commit -m "chore(security): preserve npm dependency metadata"
          git push origin HEAD:feat/trust-consent-release-marathon

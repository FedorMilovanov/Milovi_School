name: Refresh security-patched lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Resolve and commit patched dependency tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: true

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Refresh only the lockfile
        run: npm audit fix --package-lock-only

      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high

      - name: Commit exact patched lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches the patched dependency tree'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh security-patched npm lockfile'
          git push origin HEAD:main

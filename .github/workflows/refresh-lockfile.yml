name: Refresh security-patched lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  refresh:
    name: Resolve patched dependency tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Refresh only the lockfile
        run: npm audit fix --package-lock-only

      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high

      - name: Upload patched lockfile
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.2
        with:
          name: refreshed-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2

  publish-status:
    name: Publish lockfile refresh status
    if: always()
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish exact result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.refresh.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          description='Lockfile refresh failed'
          if [[ "$RESULT" == success ]]; then
            state=success
            description='Security-patched lockfile generated and audited'
          fi
          STATE="$state" DESCRIPTION="$description" TARGET_URL="$TARGET_URL" python3 - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              'state': os.environ['STATE'],
              'context': 'lockfile/refresh',
              'description': os.environ['DESCRIPTION'],
              'target_url': os.environ['TARGET_URL'],
          }))
          PY
          curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data-binary @/tmp/status.json
          test "$state" = success

name: Temporary pre-consent diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_diagnose-preconsent.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      PUBLIC_GA_ID: G-DIAGNOSTIC
      PUBLIC_YANDEX_METRIKA_ID: '12345678'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Build and serve configured candidate
        run: |
          npm ci --silent
          npx playwright install --with-deps chromium >/dev/null
          npm run build >/dev/null
          nohup python3 -m http.server 4174 --directory dist >/tmp/school-pre-server.log 2>&1 &
          echo $! >/tmp/school-pre-server.pid
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:4174/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/school-pre-server.log
          exit 1
      - name: Pre-consent A1 — network is silent
        run: |
          node <<'JS'
          const { chromium } = require('playwright')
          ;(async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({serviceWorkers:'block'});const page=await context.newPage();const requests=[];page.on('request',r=>{/googletagmanager\.com|google-analytics\.com|mc\.yandex\.ru|metrika\.yandex/i.test(r.url())&&requests.push(r.url())});await page.goto('http://127.0.0.1:4174/?diag=network',{waitUntil:'domcontentloaded'});await page.waitForTimeout(700);console.log(requests);if(requests.length)throw new Error('analytics requested before consent');await browser.close()})().catch(e=>{console.error(e);process.exit(1)})
          JS
      - name: Pre-consent A2 — exactly one panel and no direct scripts
        run: |
          node <<'JS'
          const { chromium } = require('playwright')
          ;(async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({serviceWorkers:'block'});await page.goto('http://127.0.0.1:4174/?diag=panel',{waitUntil:'domcontentloaded'});await page.waitForTimeout(700);const s=await page.evaluate(()=>({panels:document.querySelectorAll('.prs-consent').length,direct:[...document.scripts].filter(x=>/googletagmanager\.com|mc\.yandex\.ru/i.test(x.src)).length}));console.log(s);if(s.panels!==1||s.direct)throw new Error(JSON.stringify(s));await browser.close()})().catch(e=>{console.error(e);process.exit(1)})
          JS
      - name: Pre-consent A3 — one footer with all trust links
        run: |
          node <<'JS'
          const { chromium } = require('playwright')
          ;(async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({serviceWorkers:'block'});await page.goto('http://127.0.0.1:4174/?diag=footer',{waitUntil:'domcontentloaded'});const s=await page.evaluate(()=>({footers:document.querySelectorAll('footer').length,links:['/privacy/','/editorial-policy/','/sources/','/corrections/'].map(h=>Boolean(document.querySelector(`a[href="${h}"]`)))}));console.log(s);if(s.footers!==1||!s.links.every(Boolean))throw new Error(JSON.stringify(s));await browser.close()})().catch(e=>{console.error(e);process.exit(1)})
          JS
      - name: Pre-consent A4 — crawler-visible stats remain truthful after hydration
        run: |
          node <<'JS'
          const { chromium } = require('playwright')
          ;(async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({serviceWorkers:'block'});await page.goto('http://127.0.0.1:4174/?diag=stats',{waitUntil:'domcontentloaded'});await page.waitForTimeout(700);const s=await page.evaluate(()=>[...document.querySelectorAll('#stats .stat-num')].map(n=>({target:Number(n.dataset.statTarget),aria:n.getAttribute('aria-label'),text:n.textContent})));console.log(s);if(s.length!==4||s.some(x=>x.target<=0||Number((x.aria||'').replace('%',''))<=0))throw new Error(JSON.stringify(s));await browser.close()})().catch(e=>{console.error(e);process.exit(1)})
          JS
      - name: Stop diagnostic server
        if: always()
        run: kill "$(cat /tmp/school-pre-server.pid)" 2>/dev/null || true

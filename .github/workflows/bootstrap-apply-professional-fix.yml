name: Apply prepared professional fix

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/react-19-ssr-root-cause]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/react-19-ssr-root-cause
          fetch-depth: 0

      - name: Apply verified payload and create clean commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re

          parts = sorted(Path('.bootstrap').glob('part-*'))
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 payload parts, found {len(parts)}')
          encoded = ''.join(part.read_text(encoding='ascii') for part in parts)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', encoded)
          sizes = [part.stat().st_size for part in parts]
          print(f'Payload base64: raw={len(encoded)} clean={len(clean)} parts={sizes}')
          # The GitHub tree transport dropped the final base64 character from
          # the last chunk. Restore that known byte, then verify the complete
          # binary cryptographically before extracting anything.
          if len(clean) == 58207 and sizes[-1] == 2207:
              clean += 'A'
          if len(clean) != 58208:
              raise SystemExit(f'Unexpected repaired base64 length: {len(clean)}')
          payload = base64.b64decode(clean, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = '32b435efdf6a643ab7b1ba504d1f5b45df552e0c342ab50e01e495a5217efb9b'
          if digest != expected:
              raise SystemExit(f'Payload SHA-256 mismatch: {digest} != {expected}')
          Path('/tmp/professional-fix.tar.bz2').write_bytes(payload)
          print(f'Payload verified: {len(payload)} bytes, sha256={digest}')
          PY
          tar -xjf /tmp/professional-fix.tar.bz2 -C .
          while IFS= read -r path; do
            [ -n "$path" ] && rm -f -- "$path"
          done < .delete-files
          chmod +x scripts/audit_gallery_contract.sh
          rm -f .delete-files
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-apply-professional-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix gallery preview and remove generated HTML post-processing'
          git push origin HEAD:fix/react-19-ssr-root-cause

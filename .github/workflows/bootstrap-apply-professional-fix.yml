name: Apply prepared professional fix

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/react-19-ssr-root-cause]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/react-19-ssr-root-cause
          fetch-depth: 0

      - name: Apply verified payload and create clean commit
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/professional-fix.tar.bz2
          tar -xjf /tmp/professional-fix.tar.bz2 -C .
          while IFS= read -r path; do
            [ -n "$path" ] && rm -f -- "$path"
          done < .delete-files
          chmod +x scripts/audit_gallery_contract.sh
          rm -f .delete-files
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-apply-professional-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix gallery preview and remove generated HTML post-processing'
          git push origin HEAD:fix/react-19-ssr-root-cause

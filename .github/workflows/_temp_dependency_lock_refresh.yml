# One-shot workflow: self-deletes after a fully verified run.
# FINAL stable-head trigger after product, no-JS and diff-hygiene closeout.
name: TEMP dependency lock refresh

on:
  push:
    branches:
      - agent/le-canon-sucre-implementation
    paths:
      - .github/workflows/_temp_dependency_lock_refresh.yml

permissions:
  contents: write

concurrency:
  group: temp-dependency-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/le-canon-sucre-implementation
          persist-credentials: true

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.13.0
          cache: npm

      - name: Normalize Canon CSS to the data-driven grid contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/styles/canon.css')
          text = path.read_text('utf-8')
          expected = (
              '.canon-work {\n  grid-column: span 4;',
              '.canon-work-anchor { grid-column: span 8; }',
              '.canon-work { grid-column: span 6; }',
              '.canon-work { grid-column: span 12; }',
              'inset-left: 43%;',
              'inset-bottom: 44%;',
              '.canon-gateway-media-galette',
          )
          missing = [token for token in expected if token not in text]
          if missing:
              raise SystemExit(f'Expected Canon CSS contracts not found: {missing}')

          text = text.replace(
              '.canon-work {\n  grid-column: span 4;',
              '.canon-work {\n  grid-column: var(--canon-grid-start, auto) / span var(--canon-grid-span, 4);\n  grid-row: var(--canon-grid-row, auto);',
              1,
          )
          text = text.replace('\n.canon-work-anchor { grid-column: span 8; }\n', '\n', 1)
          text = text.replace('.canon-work { grid-column: span 6; }', '.canon-work { grid-column: span 6; grid-row: auto; }')
          text = text.replace('.canon-work { grid-column: span 12; }', '.canon-work { grid-column: span 12; grid-row: auto; }')
          text = text.replace('inset-left: 43%;', 'left: 43%;')
          text = text.replace('inset-bottom: 44%;', 'bottom: 44%;')
          text = text.replace('.canon-gateway-media-galette', '.canon-gateway-media-galette-des-rois')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify current lock installs
        run: npm ci

      - name: Refresh vulnerable transitive dependency lock
        run: npm audit fix --package-lock-only

      - name: Verify refreshed lock installs cleanly
        run: npm ci

      - name: Enforce security gate
        run: npm audit --audit-level=high

      - name: TypeScript gate
        run: npm run check

      - name: Production build gate
        run: npm run build

      - name: Canon static quality gate
        run: node scripts/run-python-script.mjs scripts/audit_canon.py

      - name: Remove one-shot workflow and commit verified outputs
        shell: bash
        run: |
          rm .github/workflows/_temp_dependency_lock_refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/styles/canon.css .github/workflows/_temp_dependency_lock_refresh.yml
          if git diff --cached --quiet; then
            echo "One-shot refresh produced no tracked changes; refusing to leave temporary workflow behind"
            exit 1
          fi
          git commit -m "close Canon dependency and CSS quality gates"
          git push origin HEAD:agent/le-canon-sucre-implementation

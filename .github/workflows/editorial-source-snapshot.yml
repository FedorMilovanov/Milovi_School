name: Editorial dependency compatibility

on:
  push:
    branches:
      - agent/editorial-zero-defects

permissions:
  contents: read
  statuses: write

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Generate security-patched lockfile
        run: |
          npm pkg set overrides.fast-uri=4.1.1
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install patched dependency tree
        run: npm ci

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

      - name: Verify compatibility
        run: |
          npm run check
          npm run lint
          npm run build

      - name: Upload patched manifests
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: patched-manifests-${{ github.sha }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish compatibility result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          [ "$JOB_STATUS" = "success" ] || state=failure
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"target_url\":\"$RUN_URL\",\"description\":\"Patched dependency compatibility\",\"context\":\"editorial/dependency-compatibility\"}"

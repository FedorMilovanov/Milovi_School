name: Apply final editorial payload

on:
  push:
    branches:
      - agent/editorial-zero-defects

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/editorial-zero-defects
          fetch-depth: 0

      - name: Verify and apply exact patch
        run: |
          set -euo pipefail
          test -f .editorial-payload/READY
          cat .editorial-payload/chunk-* | base64 --decode > /tmp/editorial.patch.xz
          echo 'c638595c175d13afbfcb742721743cecca3ad813f3c46ff5b3b71afe10e9a36c  /tmp/editorial.patch.xz' | sha256sum --check --strict
          xz --decompress --stdout /tmp/editorial.patch.xz > /tmp/editorial.patch
          patch --batch --forward -p1 < /tmp/editorial.patch
          rm -rf .editorial-payload
          rm -f .github/workflows/editorial-source-snapshot.yml

      - name: Commit clean project changes
        run: |
          set -euo pipefail
          git config user.name 'Milovi Editorial Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete zero-defect editorial hardening'
          git push origin HEAD:agent/editorial-zero-defects

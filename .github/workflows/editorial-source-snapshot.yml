name: Editorial source snapshot

on:
  push:
    branches:
      - agent/editorial-zero-defects

permissions:
  contents: read
  statuses: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Capture complete dependency audit
        run: npm audit --json > /tmp/npm-audit-complete.json || true

      - name: Pack repository source
        run: tar -czf /tmp/editorial-source.tar.gz --exclude=.git .

      - name: Upload source and security diagnostics
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: editorial-diagnostics-${{ github.sha }}
          path: |
            /tmp/editorial-source.tar.gz
            /tmp/npm-audit-complete.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish diagnostic run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          [ "$JOB_STATUS" = "success" ] || state=failure
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"target_url\":\"$RUN_URL\",\"description\":\"Editorial and dependency diagnostics\",\"context\":\"editorial/diagnostics\"}"

name: Apply final editorial payload

on:
  push:
    branches:
      - agent/editorial-zero-defects
    paths:
      - .editorial-payload/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/editorial-zero-defects
          fetch-depth: 0

      - name: Verify and apply exact payload
        run: |
          set -euo pipefail
          cat .editorial-payload/chunk-* | base64 --decode > /tmp/editorial-final.tar.xz
          echo '8a28c3a1a249dead875feac88a0e7d35861238c1ed6028d20be2ce1a11cc126c  /tmp/editorial-final.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/editorial-final.tar.xz -C .
          rm -rf .editorial-payload
          rm -f .github/workflows/editorial-source-snapshot.yml

      - name: Commit clean project changes
        run: |
          set -euo pipefail
          git config user.name 'Milovi Editorial Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete zero-defect editorial hardening'
          git push origin HEAD:agent/editorial-zero-defects
